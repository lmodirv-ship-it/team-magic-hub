appId: org.groupe-hn.nawat-studio
productName: NAWAT Studio
copyright: © Groupe-HN — Mouylay Ismail El Hassani

directories:
  output: dist
  buildResources: build

files:
  - main.cjs
  - preload.cjs
  - renderer/**/*
  - assets/**/*
  - package.json

win:
  target:
    - nsis
    - portable
  icon: assets/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NAWAT Studio

mac:
  target: dmg
  category: public.app-category.developer-tools
  icon: assets/icon.icns

linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: assets/icon.png
