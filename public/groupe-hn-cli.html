function row(cells){return "<tr>"+cells.map(c=>"<td>"+c+"</td>").join("")+"</tr>";}
function render(){
document.querySelectorAll("[data-ar]").forEach(e=>{e.textContent=T({ar:e.dataset.ar,fr:e.dataset.fr});});
document.getElementById("envBody").innerHTML=ENV.map(e=>row([`<code class="cmd">${e[0]}</code>`,`<code>${e[1]||"—"}</code>`,T(e[2])])).join("");

document.getElementById("mcpBody").innerHTML=MCP.map(m=>row([`<code class="cmd">${m[0]}</code>`,T(m[1]),`<code>${m[2]}</code>`])).join("");
document.getElementById("coreBody").innerHTML=CORE.map(m=>row([`<code class="cmd">${m[0]}</code>`,m[1],T(m[2])])).join("");
document.getElementById("othBody").innerHTML=OTHER.map(m=>row([`<code class="cmd">${m[0]}</code>`,m[1],T(m[2])])).join("");

document.getElementById("bAr").classList.toggle("on",LANG==="ar");
document.getElementById("bFr").classList.toggle("on",LANG==="fr");
}
function setLang(l){LANG=l;document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";render();}
